<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dual Motor PID Tuner</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --text: #1d2522;
      --muted: #68736d;
      --border: #d8ded7;
      --accent: #0f8b6f;
      --accent-strong: #08755c;
      --warn: #b64f1f;
      --danger: #b92323;
      --ok: #23764b;
      --field: #fbfcfb;
      --shadow: 0 12px 28px rgba(30, 42, 37, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: #aeb9b0;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input,
    select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      padding: 6px 8px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(246, 247, 244, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .danger:hover {
      background: #9f1f1f;
      border-color: #9f1f1f;
    }

    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 20px 24px;
      display: grid;
      gap: 16px;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value.ok {
      color: var(--ok);
    }

    .value.warn {
      color: var(--warn);
    }

    .motors {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .gimbal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }

    .gimbal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .gimbal-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .gimbal-tools label {
      display: grid;
      grid-template-columns: auto minmax(92px, 1fr);
      gap: 8px;
      align-items: center;
    }

    .gimbal-body {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 188px minmax(180px, 0.8fr);
      gap: 18px;
      align-items: center;
    }

    .axis-visual {
      display: grid;
      gap: 9px;
    }

    .axis-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .axis-track {
      position: relative;
      min-height: 56px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f1f5f2;
      overflow: hidden;
    }

    .axis-track.vertical {
      width: 76px;
      min-height: 190px;
      justify-self: center;
    }

    .axis-fill {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 50%;
      height: 100%;
      background: rgba(15, 139, 111, 0.14);
    }

    .axis-track.vertical .axis-fill {
      width: 100%;
      height: 50%;
    }

    .axis-marker {
      position: absolute;
      width: 3px;
      top: 8px;
      bottom: 8px;
      border-radius: 999px;
      background: var(--accent);
      transform: translateX(-50%);
    }

    .axis-marker.target {
      background: var(--warn);
    }

    .axis-track.vertical .axis-marker {
      width: auto;
      height: 3px;
      left: 8px;
      right: 8px;
      top: auto;
      bottom: 50%;
      transform: translateY(50%);
    }

    .axis-values {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .gimbal-pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 46px);
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .gimbal-pad button {
      min-width: 56px;
      min-height: 46px;
      padding: 0;
      font-size: 18px;
      font-weight: 800;
      touch-action: none;
      user-select: none;
    }

    .gimbal-pad .home {
      font-size: 13px;
      font-weight: 700;
    }

    .motor {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }

    .motor-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .mode {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      background: #eef3ef;
    }

    .mode button {
      border: 0;
      border-radius: 0;
      min-height: 34px;
      background: transparent;
    }

    .mode button.active {
      background: var(--accent);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr)) auto;
      gap: 10px;
      align-items: end;
    }

    .pid-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .section-title {
      margin: 2px 0 -4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .enable-on {
      color: var(--ok);
      font-weight: 700;
    }

    .enable-off {
      color: var(--danger);
      font-weight: 700;
    }

    .log {
      background: #1e2420;
      color: #dce6dd;
      border-radius: 8px;
      padding: 12px;
      min-height: 170px;
      max-height: 240px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .unsupported {
      display: none;
      padding: 10px 12px;
      background: #fff3e8;
      color: #833815;
      border: 1px solid #f0c5a3;
      border-radius: 8px;
    }

    body.no-serial .unsupported {
      display: block;
    }

    @media (max-width: 980px) {
      .bar,
      .gimbal-body,
      .motors,
      .status {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .gimbal-head,
      .gimbal-tools {
        justify-content: flex-start;
      }
    }

    @media (max-width: 640px) {
      main,
      .bar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .grid,
      .control-grid,
      .pid-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="bar">
        <h1>Dual Motor PID Tuner</h1>
        <div class="toolbar">
          <select id="baud" aria-label="Baud rate">
            <option value="230400" selected>230400 baud</option>
            <option value="115200">115200 baud</option>
          </select>
          <button id="connect" class="primary">连接串口</button>
          <button id="disconnect" disabled>断开</button>
          <button id="estop" class="danger" disabled>急停</button>
        </div>
      </div>
    </header>

    <main>
      <div class="unsupported">当前浏览器不支持 Web Serial，请使用 Chrome 或 Edge。</div>

      <section class="status">
        <div class="metric">
          <div class="label">串口状态</div>
          <div id="serialStatus" class="value warn">未连接</div>
        </div>
        <div class="metric">
          <div class="label">母线电压</div>
          <div id="vin" class="value">-- V</div>
        </div>
        <div class="metric">
          <div class="label">欠压保护</div>
          <div id="uv" class="value ok">正常</div>
        </div>
        <div class="metric">
          <div class="label">急停状态</div>
          <div id="estopStatus" class="value ok">未触发</div>
        </div>
      </section>

      <section class="gimbal" id="gimbal">
        <div class="gimbal-head">
          <h2>Gimbal Control</h2>
          <div class="gimbal-tools">
            <label>
              <span class="label">步长 deg</span>
              <select id="jogStep">
                <option value="0.5">0.5</option>
                <option value="1" selected>1</option>
                <option value="5">5</option>
                <option value="10">10</option>
              </select>
            </label>
            <button id="homeGimbal">Home</button>
          </div>
        </div>

        <div class="gimbal-body">
          <div class="axis-visual" data-axis-panel="0">
            <div class="axis-title">
              <span>Yaw / motor0</span>
              <span data-axis-readout="0">-- deg</span>
            </div>
            <div class="axis-track">
              <div class="axis-fill" data-axis-fill="0"></div>
              <div class="axis-marker" data-axis-current="0"></div>
              <div class="axis-marker target" data-axis-target="0"></div>
            </div>
            <div class="axis-values">
              <span data-axis-min="0">--</span>
              <span data-axis-max="0">--</span>
            </div>
          </div>

          <div class="gimbal-pad">
            <span></span>
            <button data-jog-motor="1" data-jog-dir="1" title="Pitch angle +">↑</button>
            <span></span>
            <button data-jog-motor="0" data-jog-dir="1" title="Yaw angle +">←</button>
            <button id="padHome" class="home">Home</button>
            <button data-jog-motor="0" data-jog-dir="-1" title="Yaw angle -">→</button>
            <span></span>
            <button data-jog-motor="1" data-jog-dir="-1" title="Pitch angle -">↓</button>
            <span></span>
          </div>

          <div class="axis-visual" data-axis-panel="1">
            <div class="axis-title">
              <span>Pitch / motor1</span>
              <span data-axis-readout="1">-- deg</span>
            </div>
            <div class="axis-track vertical">
              <div class="axis-fill" data-axis-fill="1"></div>
              <div class="axis-marker" data-axis-current="1"></div>
              <div class="axis-marker target" data-axis-target="1"></div>
            </div>
            <div class="axis-values">
              <span data-axis-min="1">--</span>
              <span data-axis-max="1">--</span>
            </div>
          </div>
        </div>
      </section>

      <section class="motors" id="motors"></section>

      <section>
        <div class="section-title">通信日志</div>
        <div id="log" class="log"></div>
      </section>
    </main>
  </div>

  <template id="motorTemplate">
    <article class="motor">
      <div class="motor-head">
        <h2></h2>
        <div class="mode">
          <button data-mode="angle">位置</button>
          <button data-mode="velocity">速度</button>
        </div>
      </div>

      <div class="grid">
        <div>
          <div class="label">当前位置 deg</div>
          <div class="value" data-readout="angle">--</div>
        </div>
        <div>
          <div class="label">当前速度 rad/s</div>
          <div class="value" data-readout="velocity">--</div>
        </div>
        <div>
          <div class="label">使能状态</div>
          <div class="value" data-readout="enabled">--</div>
        </div>
      </div>

      <div class="control-grid">
        <label>
          <span class="label" data-target-label>目标角 deg</span>
          <input type="number" step="0.1" min="0" max="360" data-target>
        </label>
        <label>
          <span class="label">电压限制 V</span>
          <input type="number" step="0.01" data-limit="voltage">
        </label>
        <label>
          <span class="label">速度限制 rad/s</span>
          <input type="number" step="0.01" data-limit="velocity">
        </label>
        <label>
          <span class="label">最小角 deg</span>
          <input type="number" step="0.1" min="0" max="360" data-angle-limit="angleMin">
        </label>
        <label>
          <span class="label">最大角 deg</span>
          <input type="number" step="0.1" min="0" max="360" data-angle-limit="angleMax">
        </label>
        <button data-enable>启用</button>
      </div>

      <div class="section-title">速度环 PID</div>
      <div class="pid-grid" data-loop="vel"></div>

      <div class="section-title">位置环 PID</div>
      <div class="pid-grid" data-loop="angle"></div>
    </article>
  </template>

  <script>
    const state = {
      port: null,
      reader: null,
      writer: null,
      readAbort: false,
      estop: false,
      motors: [{}, {}],
      activeJog: null
    };

    const els = {
      baud: document.querySelector('#baud'),
      connect: document.querySelector('#connect'),
      disconnect: document.querySelector('#disconnect'),
      estop: document.querySelector('#estop'),
      serialStatus: document.querySelector('#serialStatus'),
      vin: document.querySelector('#vin'),
      uv: document.querySelector('#uv'),
      estopStatus: document.querySelector('#estopStatus'),
      gimbal: document.querySelector('#gimbal'),
      jogStep: document.querySelector('#jogStep'),
      homeGimbal: document.querySelector('#homeGimbal'),
      padHome: document.querySelector('#padHome'),
      motors: document.querySelector('#motors'),
      log: document.querySelector('#log'),
      template: document.querySelector('#motorTemplate')
    };

    const axes = [
      { name: 'Yaw', motor: 0, home: 90 },
      { name: 'Pitch', motor: 1, home: 120 }
    ];

    const jogRepeatMs = 150;

    const pidFields = [
      ['P', 'P', '0.001'],
      ['I', 'I', '0.001'],
      ['D', 'D', '0.001'],
      ['limit', 'limit', '0.01'],
      ['output_ramp', 'ramp', '1']
    ];

    if (!('serial' in navigator)) {
      document.body.classList.add('no-serial');
      els.connect.disabled = true;
    }

    function buildMotors() {
      for (let index = 0; index < 2; index += 1) {
        const node = els.template.content.cloneNode(true);
        const article = node.querySelector('.motor');
        article.dataset.motor = String(index);
        node.querySelector('h2').textContent = `${axes[index].name} / motor${index}`;

        for (const grid of node.querySelectorAll('.pid-grid')) {
          const loop = grid.dataset.loop;
          for (const [param, label, step] of pidFields) {
            const wrapper = document.createElement('label');
            wrapper.innerHTML = `<span class="label">${label}</span>`;
            const input = document.createElement('input');
            input.type = 'number';
            input.step = step;
            input.dataset.pidLoop = loop;
            input.dataset.pidParam = param;
            wrapper.append(input);
            grid.append(wrapper);
          }
        }

        els.motors.append(node);
      }
    }

    buildMotors();

    els.connect.addEventListener('click', connect);
    els.disconnect.addEventListener('click', disconnect);
    els.estop.addEventListener('click', () => {
      stopJog();
      state.estop = true;
      updateGimbalControls();
      sendCommand('ESTOP');
    });
    els.homeGimbal.addEventListener('click', homeGimbal);
    els.padHome.addEventListener('click', homeGimbal);
    els.gimbal.addEventListener('pointerdown', event => {
      const button = event.target.closest('[data-jog-motor]');
      if (!button) return;
      event.preventDefault();
      startJog(button);
    });
    window.addEventListener('pointerup', stopJog);
    window.addEventListener('pointercancel', stopJog);
    window.addEventListener('blur', stopJog);
    updateGimbalControls();

    els.motors.addEventListener('click', event => {
      const article = event.target.closest('.motor');
      if (!article) return;
      const motor = Number(article.dataset.motor);

      if (event.target.matches('[data-mode]')) {
        state.motors[motor] = { ...state.motors[motor], mode: event.target.dataset.mode };
        updateTargetControl(article, state.motors[motor]);
        sendCommand(`MODE,${motor},${event.target.dataset.mode}`);
      }

      if (event.target.matches('[data-enable]')) {
        const current = state.motors[motor]?.requested ?? state.motors[motor]?.enabled;
        state.motors[motor] = { ...state.motors[motor], requested: current ? 0 : 1 };
        if (current) stopJog();
        updateGimbalControls();
        sendCommand(`ENABLE,${motor},${current ? 0 : 1}`);
      }
    });

    els.motors.addEventListener('change', event => {
      const article = event.target.closest('.motor');
      if (!article || !event.target.matches('input')) return;

      const motor = Number(article.dataset.motor);
      const value = event.target.value;
      if (value === '') return;

      if (event.target.matches('[data-target]')) {
        const mode = state.motors[motor]?.mode ?? 'angle';
        const target = mode === 'angle' ? clampAngleInput(value) : value;
        event.target.value = target;
        state.motors[motor] = { ...state.motors[motor], target: Number(target) };
        updateGimbalAxis(motor);
        sendCommand(`TARGET,${motor},${target}`);
      } else if (event.target.matches('[data-limit]')) {
        sendCommand(`LIMIT,${motor},${event.target.dataset.limit},${value}`);
      } else if (event.target.matches('[data-angle-limit]')) {
        const limit = clampAngleInput(value);
        event.target.value = limit;
        state.motors[motor] = {
          ...state.motors[motor],
          limits: { ...(state.motors[motor]?.limits || {}), [event.target.dataset.angleLimit]: Number(limit) }
        };
        updateGimbalAxis(motor);
        sendCommand(`LIMIT,${motor},${event.target.dataset.angleLimit},${limit}`);
      } else if (event.target.matches('[data-pid-loop]')) {
        sendCommand(`PID,${motor},${event.target.dataset.pidLoop},${event.target.dataset.pidParam},${value}`);
      }
    });

    els.motors.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.matches('input')) {
        event.target.blur();
      }
    });

    function startJog(button) {
      const motor = Number(button.dataset.jogMotor);
      const direction = Number(button.dataset.jogDir);
      if (!canControlMotor(motor)) {
        logLine('err', 'gimbal control is not ready');
        return;
      }

      stopJog();
      jogMotor(motor, direction);
      state.activeJog = window.setInterval(() => jogMotor(motor, direction), jogRepeatMs);
    }

    function stopJog() {
      if (state.activeJog) {
        window.clearInterval(state.activeJog);
        state.activeJog = null;
      }
    }

    async function jogMotor(motor, direction) {
      if (!canControlMotor(motor)) {
        stopJog();
        return;
      }

      await ensureAngleMode(motor);
      const target = currentTargetForMotor(motor);
      const nextTarget = clampAxisTarget(target + direction * currentJogStep(), motor);
      state.motors[motor] = { ...state.motors[motor], target: nextTarget, mode: 'angle' };
      syncMotorTargetInput(motor, nextTarget);
      updateGimbalAxis(motor);
      sendCommand(`TARGET,${motor},${formatCommandNumber(nextTarget)}`);
    }

    async function homeGimbal() {
      stopJog();
      for (const axis of axes) {
        if (!canControlMotor(axis.motor)) continue;
        await ensureAngleMode(axis.motor);
        const target = clampAxisTarget(axis.home, axis.motor);
        state.motors[axis.motor] = { ...state.motors[axis.motor], target, mode: 'angle' };
        syncMotorTargetInput(axis.motor, target);
        updateGimbalAxis(axis.motor);
        sendCommand(`TARGET,${axis.motor},${formatCommandNumber(target)}`);
      }
    }

    async function ensureAngleMode(motor) {
      if (state.motors[motor]?.mode === 'angle') return;
      state.motors[motor] = { ...state.motors[motor], mode: 'angle' };
      const article = els.motors.querySelector(`[data-motor="${motor}"]`);
      if (article) updateTargetControl(article, state.motors[motor]);
      await sendCommand(`MODE,${motor},angle`);
    }

    function canControlMotor(motor) {
      const selected = state.motors[motor];
      if (!state.writer || state.readAbort || !selected || !selected.enabled || !selected.requested) {
        return false;
      }
      return !state.estop;
    }

    function currentJogStep() {
      const step = Number(els.jogStep.value);
      return Number.isFinite(step) && step > 0 ? step : 1;
    }

    function currentTargetForMotor(motor) {
      const selected = state.motors[motor] || {};
      const target = Number(selected.target);
      if (Number.isFinite(target)) return target;
      const angle = Number(selected.angle);
      if (Number.isFinite(angle)) return angle;
      return axes[motor].home;
    }

    function axisLimits(motor) {
      const limits = state.motors[motor]?.limits || {};
      const minimum = Number.isFinite(Number(limits.angleMin)) ? Number(limits.angleMin) : 0;
      const maximum = Number.isFinite(Number(limits.angleMax)) ? Number(limits.angleMax) : 360;
      return { minimum, maximum };
    }

    function clampAxisTarget(value, motor) {
      const { minimum, maximum } = axisLimits(motor);
      const angle = Math.min(360, Math.max(0, Number(value)));
      if (minimum <= maximum) {
        return Math.min(maximum, Math.max(minimum, angle));
      }
      if (angle >= minimum || angle <= maximum) return angle;
      return circularDistance(angle, minimum) <= circularDistance(angle, maximum) ? minimum : maximum;
    }

    function circularDistance(left, right) {
      const distance = Math.abs(left - right);
      return distance > 180 ? 360 - distance : distance;
    }

    function syncMotorTargetInput(motor, target) {
      const article = els.motors.querySelector(`[data-motor="${motor}"]`);
      if (!article) return;
      setInput(article.querySelector('[data-target]'), target, 2);
    }

    function formatCommandNumber(value) {
      return Number(value).toFixed(3).replace(/\.?0+$/, '');
    }

    async function connect() {
      try {
        state.port = await navigator.serial.requestPort();
        await state.port.open({ baudRate: Number(els.baud.value) });
        state.writer = state.port.writable.getWriter();
        state.readAbort = false;
        setConnected(true);
        logLine('ui', `connected at ${els.baud.value} baud`);
        readLoop();
      } catch (error) {
        logLine('err', error.message);
        await disconnect();
      }
    }

    async function disconnect() {
      state.readAbort = true;
      try {
        if (state.reader) {
          await state.reader.cancel();
          state.reader.releaseLock();
        }
      } catch (_) {
      } finally {
        state.reader = null;
      }

      try {
        if (state.writer) {
          state.writer.releaseLock();
        }
      } catch (_) {
      } finally {
        state.writer = null;
      }

      try {
        if (state.port) {
          await state.port.close();
        }
      } catch (_) {
      } finally {
        state.port = null;
        setConnected(false);
      }
    }

    async function readLoop() {
      const decoder = new TextDecoder();
      let pending = '';

      try {
        state.reader = state.port.readable.getReader();
        while (!state.readAbort) {
          const { value, done } = await state.reader.read();
          if (done) break;
          pending += decoder.decode(value, { stream: true });
          const lines = pending.split(/\r?\n/);
          pending = lines.pop() ?? '';
          for (const line of lines) {
            handleLine(line.trim());
          }
        }
      } catch (error) {
        if (!state.readAbort) {
          logLine('err', error.message);
        }
      } finally {
        if (state.reader) {
          state.reader.releaseLock();
          state.reader = null;
        }
        if (!state.readAbort) {
          await disconnect();
        }
      }
    }

    function handleLine(line) {
      if (!line) return;
      if (!line.startsWith('{')) {
        logLine('raw', line);
        return;
      }

      try {
        const message = JSON.parse(line);
        if (message.type === 'tel') {
          renderTelemetry(message);
        } else if (message.type === 'ack') {
          logLine('ack', message.cmd);
        } else if (message.type === 'err') {
          logLine('err', `${message.cmd}: ${message.message}`);
        } else {
          logLine(message.type || 'json', line);
        }
      } catch (error) {
        logLine('parse', line);
      }
    }

    async function sendCommand(command) {
      if (!state.writer) {
        logLine('err', 'serial is not connected');
        return;
      }

      const bytes = new TextEncoder().encode(`${command}\n`);
      try {
        await state.writer.write(bytes);
        logLine('tx', command);
      } catch (error) {
        logLine('err', error.message);
      }
    }

    function renderTelemetry(message) {
      state.estop = Boolean(message.estop);
      els.vin.textContent = `${format(message.vin, 2)} V`;
      els.uv.textContent = message.underVoltage ? '欠压' : '正常';
      els.uv.className = `value ${message.underVoltage ? 'warn' : 'ok'}`;
      els.estopStatus.textContent = message.estop ? '已触发' : '未触发';
      els.estopStatus.className = `value ${message.estop ? 'warn' : 'ok'}`;

      for (const motor of message.motors || []) {
        state.motors[motor.index] = motor;
        const article = els.motors.querySelector(`[data-motor="${motor.index}"]`);
        if (!article) continue;

        setText(article, 'angle', format(motor.angle, 2));
        setText(article, 'velocity', format(motor.velocity, 4));
        const enabled = article.querySelector('[data-readout="enabled"]');
        enabled.textContent = motor.enabled ? '启用' : '关闭';
        enabled.className = `value ${motor.enabled ? 'enable-on' : 'enable-off'}`;

        article.querySelectorAll('[data-mode]').forEach(button => {
          button.classList.toggle('active', button.dataset.mode === motor.mode);
        });

        updateTargetControl(article, motor);
        setInput(article.querySelector('[data-target]'), motor.target, motor.mode === 'angle' ? 2 : 4);
        setInput(article.querySelector('[data-limit="voltage"]'), motor.limits?.voltage, 4);
        setInput(article.querySelector('[data-limit="velocity"]'), motor.limits?.velocity, 4);
        setInput(article.querySelector('[data-angle-limit="angleMin"]'), motor.limits?.angleMin, 2);
        setInput(article.querySelector('[data-angle-limit="angleMax"]'), motor.limits?.angleMax, 2);

        setPidInputs(article, 'vel', motor.velocityPID);
        setPidInputs(article, 'angle', motor.anglePID);
        updateGimbalAxis(motor.index);

        const enableButton = article.querySelector('[data-enable]');
        enableButton.textContent = motor.requested ? '关闭' : '启用';
      }

      updateGimbalControls();
    }

    function updateGimbalAxis(motor) {
      const selected = state.motors[motor] || {};
      const { minimum, maximum } = axisLimits(motor);
      const angle = Number(selected.angle);
      const target = Number(selected.target);
      const currentPercent = axisPercent(angle, minimum, maximum);
      const targetPercent = axisPercent(target, minimum, maximum);

      const readout = document.querySelector(`[data-axis-readout="${motor}"]`);
      const minimumLabel = document.querySelector(`[data-axis-min="${motor}"]`);
      const maximumLabel = document.querySelector(`[data-axis-max="${motor}"]`);
      const fill = document.querySelector(`[data-axis-fill="${motor}"]`);
      const currentMarker = document.querySelector(`[data-axis-current="${motor}"]`);
      const targetMarker = document.querySelector(`[data-axis-target="${motor}"]`);

      if (readout) readout.textContent = `${format(angle, 2)} deg`;
      if (minimumLabel) minimumLabel.textContent = `${format(minimum, 1)} deg`;
      if (maximumLabel) maximumLabel.textContent = `${format(maximum, 1)} deg`;
      if (fill) {
        if (motor === 1) fill.style.height = `${targetPercent}%`;
        else fill.style.width = `${targetPercent}%`;
      }
      if (currentMarker) setAxisMarker(currentMarker, motor, currentPercent);
      if (targetMarker) setAxisMarker(targetMarker, motor, targetPercent);
    }

    function setAxisMarker(marker, motor, percent) {
      const clamped = Math.min(100, Math.max(0, percent));
      if (motor === 1) {
        marker.style.left = '';
        marker.style.bottom = `${clamped}%`;
      } else {
        marker.style.bottom = '';
        marker.style.left = `${clamped}%`;
      }
    }

    function axisPercent(value, minimum, maximum) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 0;
      if (minimum === maximum) return 0;
      if (minimum < maximum) {
        return ((Math.min(maximum, Math.max(minimum, number)) - minimum) / (maximum - minimum)) * 100;
      }
      const span = 360 - minimum + maximum;
      const normalized = number >= minimum ? number - minimum : 360 - minimum + number;
      return (Math.min(span, Math.max(0, normalized)) / span) * 100;
    }

    function updateGimbalControls() {
      for (const button of els.gimbal.querySelectorAll('[data-jog-motor]')) {
        button.disabled = !canControlMotor(Number(button.dataset.jogMotor));
      }
      const canHome = axes.some(axis => canControlMotor(axis.motor));
      els.homeGimbal.disabled = !canHome;
      els.padHome.disabled = !canHome;
    }

    function updateTargetControl(article, motor) {
      const isAngleMode = (motor?.mode ?? 'angle') === 'angle';
      const label = article.querySelector('[data-target-label]');
      const input = article.querySelector('[data-target]');
      if (!label || !input) return;

      label.textContent = isAngleMode ? '目标角 deg' : '目标速度 rad/s';
      input.step = isAngleMode ? '0.1' : '0.001';
      if (isAngleMode) {
        input.min = '0';
        input.max = '360';
      } else {
        input.removeAttribute('min');
        input.removeAttribute('max');
      }
    }

    function clampAngleInput(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '0';
      const clamped = Math.min(360, Math.max(0, number));
      return clamped.toFixed(2).replace(/\.?0+$/, '');
    }

    function setPidInputs(article, loop, pid) {
      if (!pid) return;
      for (const [param] of pidFields) {
        const input = article.querySelector(`[data-pid-loop="${loop}"][data-pid-param="${param}"]`);
        setInput(input, pid[param], param === 'output_ramp' ? 2 : 6);
      }
    }

    function setInput(input, value, digits) {
      if (!input || document.activeElement === input || value === undefined || value === null) return;
      input.value = Number(value).toFixed(digits).replace(/\.?0+$/, '');
    }

    function setText(parent, key, value) {
      const node = parent.querySelector(`[data-readout="${key}"]`);
      if (node) node.textContent = value;
    }

    function format(value, digits) {
      if (!Number.isFinite(Number(value))) return '--';
      return Number(value).toFixed(digits);
    }

    function setConnected(connected) {
      if (!connected) stopJog();
      els.serialStatus.textContent = connected ? '已连接' : '未连接';
      els.serialStatus.className = `value ${connected ? 'ok' : 'warn'}`;
      els.connect.disabled = connected || !('serial' in navigator);
      els.disconnect.disabled = !connected;
      els.estop.disabled = !connected;
      els.baud.disabled = connected;
      updateGimbalControls();
    }

    function logLine(kind, text) {
      const stamp = new Date().toLocaleTimeString();
      els.log.textContent += `[${stamp}] ${kind}: ${text}\n`;
      els.log.scrollTop = els.log.scrollHeight;
    }

    window.addEventListener('beforeunload', () => {
      if (state.port) {
        disconnect();
      }
    });
  </script>
</body>
</html>
